name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy
      - name: Tests and coverage
        run: >-
          python -m pytest -q
          --cov=coding_agent --cov-branch
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-report=xml:coverage.xml
      - name: High-risk coverage gate
        run: python scripts/check_coverage.py coverage.json
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Bandit
        run: python -m bandit -q -r src
      - name: Dependency audit
        run: python -m pip_audit --skip-editable
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python evals/run_eval.py --dry-run
          python -m build
      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: CLI smoke test
        run: |
          coding-agent --version
          python -m coding_agent --version
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
